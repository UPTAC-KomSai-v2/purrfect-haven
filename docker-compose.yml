services:
  db:
    container_name: ph_mysql
    image: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
    ports: 
    - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
  server:
    build: ./server
    environment:
      - .env
    container_name: ph_server
    ports: 
    - "3000:3000"
    depends_on:
    - db

  nginx:
    build: .
    image: nginx:1.27-alpine
    container_name: purrfect_haven_nginx
    ports: 
    - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - server

volumes:
  mysql_data:

